services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: firebuster:latest
    ports:
      - "8000:8000"
    environment:
      client_id: ${client_id:-firebuster-client}
    depends_on:
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD} 
    volumes:
      - ./kcdb/data/import:/opt/keycloak/data/import
    command: start-dev --import-realm
